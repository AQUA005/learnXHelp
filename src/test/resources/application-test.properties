# In-memory database per test run. The dev seed data is not loaded, because
# DataInitializer is restricted to the dev profile.
spring.datasource.url=jdbc:h2:mem:learnx-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
