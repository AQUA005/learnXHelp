
# Tests run migrations against H2 in PostgreSQL compatibility mode, which
# exercises the real migration scripts without needing a database daemon.
spring.datasource.url=jdbc:h2:mem:learnx-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.h2.console.enabled=false
