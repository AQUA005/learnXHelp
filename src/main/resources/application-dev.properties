# Local development profile: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# Enables the demo seed data (DataInitializer) and the H2 console. Neither is
# available in any other profile.

# H2 console at http://localhost:8080/h2-console, reachable only from this machine.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.jpa.show-sql=false
logging.level.org.springframework.security=DEBUG
