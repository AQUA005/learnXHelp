spring.application.name=LearnX
server.port=${PORT:8080}


# Datasource configuration (supports local H2 by default, and automatically overrides for PostgreSQL/Render if env variables are present)
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:h2:file:${DATABASE_DIR:~/.learnx}/learnxdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${JDBC_DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${JDBC_DATABASE_PASSWORD:}}


# H2 console. Disabled by default: it is an unauthenticated SQL shell.
# application-dev.properties re-enables it bound to localhost only.
spring.h2.console.enabled=false

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File upload properties (allow large notes/resource sharing files)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Session cookie hardening. secure=true is set by the prod profile, since
# local development runs over plain HTTP.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Do not keep a JPA session open during response rendering.
spring.jpa.open-in-view=false

logging.level.org.springframework.security=INFO

# Mail Configuration (e.g. Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=mail.privateemail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
