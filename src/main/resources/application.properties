spring.application.name=LearnX
server.port=${PORT:8080}


# Datasource configuration (supports local H2 by default, and automatically overrides for PostgreSQL/Render if env variables are present)
# PostgreSQL is the deployment target. With no environment override the app
# falls back to a local H2 file running in PostgreSQL compatibility mode, so
# the same migrations apply in both places.
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:h2:file:${DATABASE_DIR:~/.learnx}/learnxdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${JDBC_DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${JDBC_DATABASE_PASSWORD:}}


# H2 console. Disabled by default: it is an unauthenticated SQL shell.
# application-dev.properties re-enables it bound to localhost only.
spring.h2.console.enabled=false

# The schema is owned by the Flyway migrations in db/migration. Hibernate only
# checks that the entity mappings match what the migrations produced.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Uploaded files are written under this directory, not into the database.
# Point it at a mounted volume in a container deployment.
learnx.storage.root=${LEARNX_STORAGE_ROOT:${java.io.tmpdir}/learnx-files}
learnx.storage.max-file-size-bytes=52428800

# File upload properties (allow large notes/resource sharing files)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Session cookie hardening. secure=true is set by the prod profile, since
# local development runs over plain HTTP.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Do not keep a JPA session open during response rendering.
spring.jpa.open-in-view=false

logging.level.org.springframework.security=INFO

# Mail Configuration (e.g. Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=mail.privateemail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Operational endpoints. Only health and info are exposed; health is reachable
# without a session so a container or load balancer can probe it, and the rest
# require an administrator (see SecurityConfig).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.info.env.enabled=false

# Mail is a secondary function: the application serves every other feature
# without it. Left enabled, an unconfigured or unreachable SMTP host marks the
# whole service DOWN, which would fail the container health check and restart a
# perfectly serviceable application.
management.health.mail.enabled=false
