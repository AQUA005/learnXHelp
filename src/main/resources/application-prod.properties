# Production profile. Every value here assumes the app sits behind a TLS
# terminating reverse proxy.

# Session cookies must never travel over plain HTTP.
server.servlet.session.cookie.secure=true

# The schema is owned by migrations, not by Hibernate.
# Requires the Flyway migrations added in Phase 2 — until then, run prod with
# SPRING_JPA_HIBERNATE_DDL_AUTO=update.
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false
spring.jpa.show-sql=false

# Do not leak internals in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
logging.level.org.springframework.security=INFO

# Structured logs, so a collector can index the request id and username that
# LoggingContextFilter attaches to every line.
logging.structured.format.console=ecs

# Metrics are useful in production but must not be public.
management.endpoints.web.exposure.include=health,info,metrics
