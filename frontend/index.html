<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      The platform owner's small logo, falling back to the one bundled in the
      jar when none has been uploaded. There was no icon link at all before, so
      every page load made a request for /favicon.ico that nothing answered.
    -->
    <link rel="icon" href="/api/public/branding/icon" />
    <!--
      Space Grotesk sets the headings and Outfit the body text. Preconnected
      because the stylesheet request and the font files it names are on
      separate hosts, and the second one is not discoverable until the first
      has answered.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&family=Space+Grotesk:wght@400..700&display=swap"
    />
    <title>LearnX</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
