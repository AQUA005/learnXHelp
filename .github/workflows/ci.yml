name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Runs the migrations against H2 in PostgreSQL compatibility mode and
      # boots with ddl-auto=validate, so an entity that has drifted from the
      # schema fails here. Also builds, type-checks and lints the frontend.
      - name: Verify
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: learnx-jar
          path: target/*.jar
          retention-days: 7

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download the jar
        uses: actions/download-artifact@v4
        with:
          name: learnx-jar
          path: target

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Against the packaged jar, not a development server, so the smoke test
      # exercises what would actually be deployed.
      - name: Start the application
        run: |
          mkdir -p /tmp/learnx-files
          LEARNX_STORAGE_ROOT=/tmp/learnx-files \
          DATABASE_DIR=/tmp/learnx-db \
          nohup java -jar target/*.jar --spring.profiles.active=dev > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Application is up"; exit 0
            fi
            sleep 2
          done
          echo "The application did not start"; cat /tmp/app.log; exit 1

      - name: Run the smoke test
        working-directory: frontend
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Application log on failure
        if: failure()
        run: cat /tmp/app.log

  image:
    name: Publish the container image
    runs-on: ubuntu-latest
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
