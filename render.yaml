# Render blueprint for LearnX.
#
# In the Render dashboard: New > Blueprint, point it at this repository, and
# Render reads this file to create the web service and the disk that holds
# uploaded files.
#
# Values marked sync: false are not stored in this file. Render prompts for them
# on the first sync and keeps whatever is set on the service afterwards, which
# is what keeps credentials out of the repository.
# See DEPLOYING.md for the walk-through.

# The database is NOT declared here. Render's free PostgreSQL is removed after a
# trial period, so DEPLOYING.md points at a provider whose free tier is not, and
# DATABASE_URL below is entered by hand.
#
# To use Render's own PostgreSQL instead, uncomment this block and replace the
# DATABASE_URL entry below with the fromDatabase form shown there.
#
# databases:
#   - name: learnx-db
#     databaseName: learnx
#     user: learnx
#     plan: free

services:
  - type: web
    name: learnx
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # The connection string from Neon, Supabase or whichever provider holds
      # the database, in the form postgresql://user:password@host/database.
      # The application converts it to a JDBC URL at startup.
      #
      # sync: false means Render prompts for it and keeps it out of this file.
      # It also means re-syncing the blueprint will not overwrite the value
      # already set on the service, which a fromDatabase entry would.
      #
      # On Render's own PostgreSQL, replace this with:
      #   - key: DATABASE_URL
      #     fromDatabase:
      #       name: learnx-db
      #       property: connectionString
      - key: DATABASE_URL
        sync: false

      # Uploaded study material is written here, on the disk mounted below.
      - key: LEARNX_STORAGE_ROOT
        value: /var/lib/learnx/files

      # Creates the first administrator, once, on a database with no accounts.
      # Render prompts for these; remove the password once you have signed in
      # and changed it.
      - key: LEARNX_ADMIN_USERNAME
        sync: false
      - key: LEARNX_ADMIN_PASSWORD
        sync: false
      - key: LEARNX_ADMIN_EMAIL
        sync: false

      # Optional: needed only for sign-up and password-recovery email. Leave
      # unset and the rest of the application still works.
      - key: SPRING_MAIL_HOST
        sync: false
      # 2525, not the usual 587: Render blocks outgoing connections on ports
      # 25, 465 and 587 from its free instance types, and a blocked port does
      # not refuse the connection, it swallows it — every send then hangs until
      # it times out. Brevo, SMTP2GO, Mailjet and Mailgun all accept
      # submissions on 2525. On a paid instance either port works.
      - key: SPRING_MAIL_PORT
        value: "2525"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      # Only needed when the SMTP username is not itself a mailbox address,
      # which is the case for relays such as Brevo, Resend or SMTP2GO.
      - key: LEARNX_MAIL_FROM
        sync: false

    # Without a disk the container's filesystem is replaced on every deploy and
    # every uploaded file is lost. A disk requires a paid instance type; if you
    # stay on the free plan, remove this block and expect uploads to disappear
    # when the service restarts.
    disk:
      name: learnx-files
      mountPath: /var/lib/learnx/files
      sizeGB: 1
